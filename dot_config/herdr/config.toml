onboarding = false

[ui]
show_agent_labels_on_pane_borders = true

agent_panel_sort = "spaces"

[ui.sound]
enabled = true

[ui.toast]
delivery = "system"

[theme]
name = "gruvbox"
auto_switch = false

[keys]
new_worktree = ""
open_worktree = ""
remove_worktree = ""

[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "disintegrator.trunkr.create"
description = "create worktree"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "disintegrator.trunkr.open"
description = "open worktree"

[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "disintegrator.trunkr.merge"
description = "merge worktree"

[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "disintegrator.trunkr.remove"
description = "remove worktree"
